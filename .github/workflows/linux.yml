name: Linux

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated:
    name: 'Check generated files are up to date'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: cd src && bash gen.sh
    - run: git diff --exit-code -- src/

  gcc-build:
    needs: check-generated
    name: 'Linux ${{matrix.name}} ${{matrix.build_type}}'
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC-9,  os: ubuntu-22.04, cc: gcc-9,  cxx: g++-9,  pkg: gcc-9 g++-9,   build_type: RelWithDebInfo }
          - { name: GCC-14, os: ubuntu-latest, cc: gcc-14, cxx: g++-14, pkg: gcc-14 g++-14,  build_type: RelWithDebInfo }
          - { name: GCC-14, os: ubuntu-latest, cc: gcc-14, cxx: g++-14, pkg: gcc-14 g++-14,  build_type: Debug   }
          - { name: GCC-14 arm64, os: ubuntu-24.04-arm, cc: gcc-14, cxx: g++-14, pkg: gcc-14 g++-14, build_type: RelWithDebInfo }
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build ${{matrix.pkg}}
    - name: Configure
      run: |
        export CC=${{matrix.cc}} CXX=${{matrix.cxx}}
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DCMAKE_INSTALL_PREFIX=$HOME/lace-install \
          -DLACE_BUILD_TESTS=ON \
          -DLACE_BUILD_BENCHMARKS=${{ matrix.build_type == 'RelWithDebInfo' && 'ON' || 'OFF' }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure -VV --timeout 60
    - name: Install
      run: cmake --install build
    - name: Run pkg-config consumer test
      working-directory: test/install/consumer-pkgconfig
      run: |
        export PKG_CONFIG_PATH=$HOME/lace-install/lib/pkgconfig
        bash test.sh
    - name: Run CMake consumer test
      working-directory: test/install/consumer-cmake
      run: |
        export CMAKE_PREFIX_PATH=$HOME/lace-install
        bash test.sh

  clang-build:
    needs: check-generated
    name: 'Linux Clang-18${{matrix.arch}} ${{matrix.build_type}}'
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        build_type: [RelWithDebInfo, Debug]
        os: [ubuntu-latest]
        include:
          - { build_type: RelWithDebInfo, os: ubuntu-24.04-arm, arch: ' arm64' }
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build clang-18
    - name: Configure
      run: |
        export CC=clang-18 CXX=clang++-18
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
          -DLACE_BUILD_TESTS=ON \
          -DLACE_BUILD_BENCHMARKS=${{ matrix.build_type == 'RelWithDebInfo' && 'ON' || 'OFF' }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure -VV --timeout 60

  all-options:
    needs: check-generated
    name: 'Linux GCC all options enabled'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build gcc g++ libhwloc-dev
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLACE_BUILD_TESTS=ON \
          -DLACE_BUILD_BENCHMARKS=ON \
          -DLACE_USE_HWLOC=ON \
          -DLACE_COUNT_TASKS=ON \
          -DLACE_COUNT_STEALS=ON \
          -DLACE_COUNT_SPLITS=ON \
          -DLACE_PIE_TIMES=ON \
          -DBUILD_SHARED_LIBS=ON
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure -VV --timeout 60

  no-backoff:
    needs: check-generated
    name: 'Linux GCC BACKOFF=OFF'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build gcc g++
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLACE_BUILD_TESTS=ON \
          -DLACE_BUILD_BENCHMARKS=OFF \
          -DLACE_BACKOFF=OFF
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure -VV --timeout 60

  i386-m32:
    needs: check-generated
    name: 'Linux i386 (-m32) RelWithDebInfo'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install 32-bit toolchain
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y cmake ninja-build gcc-multilib g++-multilib libc6-dev:i386
    - name: Configure (32-bit)
      run: |
        cmake -S . -B build32 -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLACE_BUILD_TESTS=ON \
          -DLACE_BUILD_BENCHMARKS=OFF \
          -DCMAKE_C_FLAGS="-m32" \
          -DCMAKE_CXX_FLAGS="-m32"
    - name: Build
      run: cmake --build build32
    - name: Test
      run: ctest --test-dir build32 --output-on-failure -VV --timeout 60 -j 1
